name: ci

# Every skill must pass skill-validator and deploy with pollen: both checks run
# in groupbees/skill-action. Dependabot bumps the action pins below.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  skills:
    name: Validate skills
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: groupbees/skill-action@0e139db79d4d635ee7ffc973008e56e0e07da4a1  # v0.1.0
        with:
          skill-validator-version: v1.8.0
          pollen-version: v0.7.0

  catalog:
    name: README table, scripts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - run: scripts/skills-catalog.sh --check-readme
      # shellcheck ships on the GitHub runners.
      - run: find scripts skills -name '*.sh' -print0 | xargs -0 --no-run-if-empty shellcheck
