name: Release

on:
  push:
    tags: ['v*.*.*']

env:
  GCP_RUNTIME_PROJECT: <prefix>-<app>-prd
  GCP_AR_PROJECT: <prefix>-platform
  GCP_REGION: europe-west1
  AR_REPOSITORY: docker            # immutable repo for prd-grade images
  AR_CACHE_REPOSITORY: docker-ci   # mutable repo for build cache layers
  IMAGE_NAME: <app>
  CLOUD_RUN_SERVICE: <app>

jobs:
  release:
    runs-on: ubuntu-latest
    environment: prd
    permissions:
      contents: write   # required to create the GitHub Release
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA_FAC_PRD }}      # ← prd SA

      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet
      - uses: docker/setup-buildx-action@v3

      - id: vars
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/bake-action@v5
        with: { files: docker-bake.hcl, push: true }
        env:
          REGISTRY: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_AR_PROJECT }}/${{ env.AR_REPOSITORY }}
          CACHE_REGISTRY: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_AR_PROJECT }}/${{ env.AR_CACHE_REPOSITORY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          TAG: ${{ steps.vars.outputs.version }}

      - uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.CLOUD_RUN_SERVICE }}
          project_id: ${{ env.GCP_RUNTIME_PROJECT }}
          region: ${{ env.GCP_REGION }}
          image: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_AR_PROJECT }}/${{ env.AR_REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.version }}
          flags: >-
            --port=8080
            --no-allow-unauthenticated
            --iap
            --service-account=<app>-runtime@${{ env.GCP_RUNTIME_PROJECT }}.iam.gserviceaccount.com
            --update-env-vars=KEY1=${{ vars.KEY1 }},KEY2=${{ vars.KEY2 }}
            --update-secrets=SECRET_KEY=<secret-name>:latest

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
