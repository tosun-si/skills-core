name: CI/CD

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  GCP_RUNTIME_PROJECT: <prefix>-<app>-dev
  GCP_AR_PROJECT: <prefix>-platform
  GCP_REGION: europe-west1
  AR_REPOSITORY: docker            # immutable repo for prd-grade images
  AR_CACHE_REPOSITORY: docker-ci   # mutable repo for build cache layers
  IMAGE_NAME: <app>
  CLOUD_RUN_SERVICE: <app>

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with: { enable-cache: true }
      - run: uv python install 3.13
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run ty check .
      - run: uv run pytest -q

  build-and-deploy:
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
      || github.event_name == 'workflow_dispatch'
    needs: lint-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # required for WIF
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA_FAC_DEV }}

      - uses: google-github-actions/setup-gcloud@v2

      - run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - uses: docker/setup-buildx-action@v3

      - uses: docker/bake-action@v5
        with:
          files: docker-bake.hcl
          push: true
        env:
          REGISTRY: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_AR_PROJECT }}/${{ env.AR_REPOSITORY }}
          CACHE_REGISTRY: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_AR_PROJECT }}/${{ env.AR_CACHE_REPOSITORY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          TAG: ${{ github.sha }}

      - uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.CLOUD_RUN_SERVICE }}
          project_id: ${{ env.GCP_RUNTIME_PROJECT }}
          region: ${{ env.GCP_REGION }}
          image: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_AR_PROJECT }}/${{ env.AR_REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          flags: >-
            --port=8080
            --no-allow-unauthenticated
            --iap
            --service-account=<app>-runtime@${{ env.GCP_RUNTIME_PROJECT }}.iam.gserviceaccount.com
            --update-env-vars=KEY1=${{ vars.KEY1 }},KEY2=${{ vars.KEY2 }}
            --update-secrets=SECRET_KEY=<secret-name>:latest
